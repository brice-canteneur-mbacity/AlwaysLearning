<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AlwaysLearning</title>
    <base href="/" />
    <meta name="theme-color" content="#0f1226" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)" />
    <script>
        // Applique apparence et palette AVANT le rendu pour éviter tout flash.
        (function () {
            try {
                var root = document.documentElement;
                var appearance = localStorage.getItem('al:appearance') || 'auto';
                var palette = localStorage.getItem('al:palette') || 'standard';
                function applyAppearance(mode) {
                    if (mode === 'auto') {
                        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        root.dataset.theme = dark ? 'dark' : 'light';
                    } else {
                        root.dataset.theme = mode;
                    }
                }
                applyAppearance(appearance);
                root.dataset.palette = palette;
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
                    if ((localStorage.getItem('al:appearance') || 'auto') === 'auto') applyAppearance('auto');
                });
            } catch (e) { /* localStorage indisponible */ }
        })();
    </script>
    <meta name="description" content="Apprends quelque chose de nouveau chaque jour." />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue s'est produite.
        <a href="" class="reload">Recharger</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
